# =============================================================================
# Railway Configuration for Ghostfolio Agent
# =============================================================================
# This file configures deployment to Railway (https://railway.app)
#
# IMPORTANT: This configuration deploys the BACKEND ONLY.
# For full deployment with frontend, use Dockerfile.backend and Dockerfile.frontend
# separately as documented in docs/DEPLOYMENT.md
#
# Quick Start (Backend Only):
#   1. Install Railway CLI: npm install -g @railway/cli
#   2. Login: railway login
#   3. Create project: railway init
#   4. Deploy: railway up
#   5. Set variables: railway variables set OPENAI_API_KEY=your_key
#   6. Generate domain: railway domain
#
# For Full Deployment (Backend + Frontend):
#   See docs/DEPLOYMENT.md for detailed instructions
# =============================================================================

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backend"

[deploy]
# Health check configuration
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Resource configuration (adjust based on usage)
# Railway auto-scales, but you can set limits
# memory = "1Gi"
# cpu = "1"

# Number of replicas (for high availability)
# numReplicas = 1
