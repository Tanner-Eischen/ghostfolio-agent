# =============================================================================
# Ghostfolio Agent Docker Compose
# =============================================================================
# Run FastAPI backend with optional local Ghostfolio instance
#
# Usage:
#   docker-compose up -d          # Start services in background
#   docker-compose up --build     # Rebuild and start
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop services
#
# Services:
#   - backend: FastAPI on http://localhost:8000

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostfolio-agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GHOSTFOLIO_API_URL=${GHOSTFOLIO_API_URL:-http://ghostfolio:3333}
      - GHOSTFOLIO_ACCESS_TOKEN=${GHOSTFOLIO_ACCESS_TOKEN}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-true}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - HOST=0.0.0.0
      - PORT=8000
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ghostfolio-network

  # ---------------------------------------------------------------------------
  # Optional: Local Ghostfolio instance for development
  # Uncomment to run Ghostfolio locally
  # ---------------------------------------------------------------------------
  # ghostfolio:
  #   image: ghostfolio/ghostfolio:latest
  #   ports:
  #     - "3333:3333"
  #   environment:
  #     - DATABASE_URL=... # See Ghostfolio docs
  #   networks:
  #     - ghostfolio-network

networks:
  ghostfolio-network:
    driver: bridge
