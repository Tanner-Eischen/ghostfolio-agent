# =============================================================================
# Railway Multi-Service Reference
# =============================================================================
# Do NOT add a railway.json at the repo root. It is applied to every service
# and overrides the frontend, forcing Dockerfile.backend on both. Use the
# Dashboard to set the Dockerfile path per service (see below).
#
# Railway does NOT support "railway up --file" or multiple services in one
# config. Use the Dashboard to configure each service, then deploy via CLI.
#
# Setup (once):
#   1. Railway Dashboard: New Project → add two services (e.g. "backend", "frontend")
#   2. Connect the same GitHub repo to both services
#   3. Backend service → Settings → Build → Dockerfile path: Dockerfile.backend
#   4. Frontend service: use its own root and config so it never sees backend config:
#      - Settings → Build → Root Directory: frontend
#      - Settings → Build → Config as code file: frontend/railway.json (or frontend/railway.toml; type path if not in dropdown)
#      (That uses frontend/railway.toml + frontend/Dockerfile; no root railway.json.)
#   5. Backend service → Settings → Build → Dockerfile path: Dockerfile.backend
#      (No root railway.json in repo; set Dockerfile in Dashboard.)
#   6. Set variables per service (see below)
#
# Deploy (per service) — CLI:
#   railway link              # one-time: pick project + service (backend or frontend)
#   railway up                 # deploy current branch to the linked service
#   railway up -s frontend     # deploy to frontend without changing link
#   railway up -s backend      # deploy to backend
#   railway variable set KEY=value   # set env var for linked service
#
# Note: Root Directory and "Config as code file" cannot be set via CLI; set them
# once in the Dashboard (Settings → Build) for each service, then use CLI for
# link / up / variable.
# =============================================================================

# Backend Service (FastAPI)
[[services]]
name = "backend"
dockerfile = "Dockerfile.backend"
healthcheckPath = "/health"
healthcheckTimeout = 30

[services.variables]
# Required - set these in Railway Dashboard or CLI
# OPENAI_API_KEY = ""
# LANGSMITH_API_KEY = ""
# LANGSMITH_WORKSPACE_ID = ""
# GHOSTFOLIO_ACCESS_TOKEN = ""

# Optional with defaults
LANGSMITH_TRACING = "true"
LANGSMITH_ENDPOINT = "https://api.smith.langchain.com"
LANGSMITH_PROJECT = "AgentForge"
USE_MOCK_DATA = "true"
YAHOO_FINANCE_ENABLED = "true"
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"

# Frontend Service (Streamlit)
[[services]]
name = "frontend"
dockerfile = "Dockerfile.frontend"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30

[services.variables]
# Reference backend URL (Railway internal DNS)
BACKEND_URL = "http://backend.railway.internal:8000"

# If using Railway public URLs:
# BACKEND_URL = "https://${{backend.RAILWAY_PUBLIC_DOMAIN}}"

# Optional settings
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"

