[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostfolio-agent"
version = "0.1.0"
description = "AI-powered portfolio assistant for Ghostfolio - Analyze, categorize, and assess risk with natural language"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ghostfolio Agent Team", email = "team@ghostfolio-agent.dev" }
]
keywords = [
    "ghostfolio",
    "portfolio",
    "finance",
    "ai",
    "agent",
    "langchain",
    "langgraph",
    "wealth-management"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core Agent Framework
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    # LLM
    "openai>=1.0.0",
    # API & HTTP
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Frontend
    "streamlit>=1.38.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "pre-commit>=3.8.0",
    "vcrpy>=6.0.0",
]

[project.scripts]
ghostfolio-agent = "src.api.routes:run_server"

[project.urls]
Homepage = "https://github.com/ghostfolio-agent/ghostfolio-agent"
Documentation = "https://github.com/ghostfolio-agent/ghostfolio-agent#readme"
Repository = "https://github.com/ghostfolio-agent/ghostfolio-agent"
Issues = "https://github.com/ghostfolio-agent/ghostfolio-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
